# daily-trend 設定
# 変更したら次回の `trend run` から反映される（TrendBar のホットキーはアプリ再起動で反映）。

[pick]
# 要約に使う Claude のモデル。安くしたいときは "claude-sonnet-5" や "claude-haiku-4-5" に変える。
model = "claude-opus-5"
# 何日前までに選んだ記事を「既出」として除外するか
dedupe_days = 30
# 選考に回す候補の最大件数（各取得元の上位から、ほぼ同じ件数ずつ）
max_candidates = 60

# 選ぶときの優先順位。上から優先。
interests = """
1. AI/ML の新しい手法・モデル・論文・ツール（LLM、エージェント、学習・推論の効率化、評価手法）
2. 科学計算・シミュレーション × 機械学習
3. 開発ツール・プログラミング環境の大きな変化（エディタ、AI コーディング、言語・ランタイム）
4. その他、技術者の間で広く話題になっている技術ニュース
優先度を下げるもの: 資金調達・人事・株価・訴訟だけの話題、ゴシップ、特定製品の宣伝記事、個人の感想エッセイ
"""

# どの種類から選ぶか。
#   "balanced"  すべての種類から選ぶ
#   "news"      ニュース・発表だけ（新しいモデル・製品・バージョンなど。HN / Techmeme / はてブ / 公式ブログ）
#   "blogs"     テックブログだけ（Zenn / Qiita / 企業のテックブログ）
#   "oss"       OSS・公開モデルだけ（GitHub / Hugging Face のモデル）
#   "papers"    論文だけ（Hugging Face Daily Papers）
#   "custom"    下の [pick.weights] の重みを使う
# その回だけ変えるときは `trend run --force --focus blogs`、または TrendBar のメニュー「種類を指定して生成」。
focus = "balanced"

# focus = "custom" のときだけ使う重み。大きい種類ほど候補の上位に入る。0 にするとその種類を候補から外す。
[pick.weights]
news = 1.0
blogs = 1.0
oss = 1.0
papers = 1.0

[sources]
# true/false で取得元を切り替える
hackernews = true
github = true        # 公式 Search API（30日以内に作成・1日あたりのスター数順）
github_trending = true  # 直近24時間にスターが多く付いたリポジトリ（作成時期を問わない。公開イベントの標本集計）
hf_papers = true
hf_models = true
hatena = true
zenn = true
qiita = true
techmeme = true      # X での反応数（Techmeme が収集した投稿数）もここから取る
techblogs = true     # 企業のテックブログ（下の [feeds.techblogs]）
official = true      # 公式ブログ（下の [feeds.official]）
# reddit / lobsters / x は使わない（規約・robots.txt が自動取得を拒否。README 参照）

# RSS / Atom で読むブログ。「表示名 = フィードの URL」で足したり消したりできる。
# 候補にするのは max_age_days 日以内の記事で、1つのブログにつき新しい順に5件まで。はてなブックマーク数と新しさで並べる。
[feeds]
max_age_days = 7

